RepoName: JJGGu/springboot-ecs-sourcecode-demo
RunCommand: |
  echo "start run command"
SourceCodePath: .
CommandTimeout: 3600
SecurityGroupPorts:
- 80
RuntimeType: LinuxShell
ServicePorts:
- 80
ServiceType: private
ArtifactSourceType: SourceCode
ServiceBuildRegion: ap-southeast-1
ImageId: '"{{resolve:oos:aliyun/services/ecs/images/linux/aliyun-latest/alibaba_cloud_linux_3_2104_lts_x64}}"'
RegionId: cn-hangzhou
CustomParameters:
- NoEcho: true
  Type: String
  AssociationProperty: ALIYUN::ECS::Instance::Password
  Label: 管理员密码
  Name: AdminPassword
Owner: JJGGu
Branch: main
Platform: github
